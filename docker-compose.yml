# Local development services for Nerva.
# Only PostgreSQL runs in Docker; the API and web app run on the host.
#
# Host port defaults to 5433 (not 5432) so it does not collide with a
# PostgreSQL server you may already have installed locally.
services:
  postgres:
    image: postgres:17-alpine
    container_name: nerva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nerva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nerva}
      POSTGRES_DB: ${POSTGRES_DB:-nerva}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - nerva-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nerva} -d ${POSTGRES_DB:-nerva}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nerva-postgres-data:
