[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nerva-api"
version = "0.1.0"
description = "Nerva API: multi-tenant backend for the AI operating system for small companies."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "bcrypt>=4.2",
    "cryptography>=43",
    # OAuth token exchange/refresh and Gmail API calls (nerva_connect/google/).
    "httpx>=0.28",
    # ID-token verification only (google.oauth2.id_token): not the full API client,
    # to keep the Google-specific footprint small (see docs/ARCHITECTURE.md).
    "google-auth>=2.35",
    # google-auth's own HTTP transport for fetching Google's public certs during
    # ID-token verification; required by google.auth.transport.requests.
    "requests>=2.32",
    # Nerva AI: the real AIAnalysisClient (nerva_ai/providers/openai.py) only —
    # never imported outside that one module. Structured Outputs (response_format=
    # a Pydantic model) needs a reasonably current SDK.
    "openai>=1.54",
    # Nerva AI: the real Groq-backed AgentReasoningClient
    # (nerva_ai/providers/groq_agent_reasoning.py) only — never imported outside
    # that one module. M7.1g.1's audit confirmed the official SDK (not the OpenAI
    # SDK against Groq's OpenAI-compatible endpoint) is the right choice here.
    "groq>=1.7,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nerva"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = [
    "S101",   # assert is fine in tests
    "B008",   # FastAPI uses Depends() in argument defaults
    "RUF012", # SQLAlchemy __table_args__ are class-level by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["nerva"]
